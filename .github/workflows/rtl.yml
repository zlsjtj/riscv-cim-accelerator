name: Public RTL regression

on: [push, pull_request]

permissions:
  contents: read

jobs:
  iverilog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - memory: variable
            variant: turnaround
            dataset: synthetic
          - memory: fixed
            variant: banked
            dataset: matrix
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install simulator and reference compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog g++
          python3 --version
          g++ --version
      - name: Official reference, units and full operator
        run: >-
          python3 tools/run.py --simulator iverilog --dataset ${{ matrix.dataset }}
          --memory ${{ matrix.memory }} --variant ${{ matrix.variant }}

  ibex:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Ibex simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf g++ make libelf-dev python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tools/requirements-ibex.txt
      - name: Run the two-layer M1 firmware on Ibex
        run: |
          source .venv/bin/activate
          MAKEFLAGS=-j2 python3 tools/run_ibex.py
