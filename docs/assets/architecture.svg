<title id="title">RISC-V CiM system and KWS handoffs</title><desc id="desc">RISC-V writes START and reads DONE through the controller MMIO interface. CPU depthwise runs between two independently submitted pointwise tasks and exchanges tensors through shared SRAM.</desc>
