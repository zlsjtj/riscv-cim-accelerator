<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
<title id="title">RISC-V CiM system and KWS handoffs</title><desc id="desc">A RISC-V CPU controls a shared-SRAM accelerator over MMIO. CPU depthwise runs between two separately submitted pointwise tasks and exchanges tensors in SRAM.</desc>
